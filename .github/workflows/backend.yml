# Backend: every push to main is type-checked. Deploying is manual: GitHub → Actions → "Backend" →
# "Run workflow" (on main). GitHub signs in to Google Cloud with Workload Identity Federation: no stored keys,
# and Google only accepts tokens from this repository's main branch.
name: Backend
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  PROJECT: cbi-mail-pilot
  REGION: us-west1
  IMAGE: us-west1-docker.pkg.dev/cbi-mail-pilot/cbi-mail/api
  MIGRATIONS: gs://cbi-mail-pilot-migrations
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit --module nodenext --moduleResolution nodenext --target es2022 --skipLibCheck src/server.ts src/sync-job.ts src/import-hiver.ts

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1040388630993/locations/global/workloadIdentityPools/github/providers/github
          service_account: cbi-mail-deployer@cbi-mail-pilot.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply new database migrations (each file once, in order)
        run: |
          for f in $(ls backend/sql/0*.sql | sort); do
            n=$(basename "$f")
            if gcloud storage objects describe "$MIGRATIONS/applied/$n" --project "$PROJECT" >/dev/null 2>&1; then continue; fi
            echo "Applying $n"
            gcloud storage cp "$f" "$MIGRATIONS/pending/$n" --project "$PROJECT"
            gcloud sql import sql cbi-mail-db "$MIGRATIONS/pending/$n" --database=cbimail --user=postgres --project "$PROJECT" --quiet
            echo "$GITHUB_SHA" | gcloud storage cp - "$MIGRATIONS/applied/$n" --project "$PROJECT"
          done
      - name: Build and push image
        run: |
          TAG="${GITHUB_SHA::12}"
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:$TAG" backend
          docker push "$IMAGE:$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Deploy API and sync job
        run: |
          gcloud run deploy cbi-mail-api --image "$IMAGE:$TAG" --region "$REGION" --project "$PROJECT" --quiet
          gcloud run jobs update cbi-mail-sync --image "$IMAGE:$TAG" --region "$REGION" --project "$PROJECT" --quiet
      - name: Check the new version is serving
        run: |
          gcloud run services describe cbi-mail-api --region "$REGION" --project "$PROJECT" \
            --format='value(status.conditions[0].type,status.conditions[0].status,status.latestReadyRevisionName)'
