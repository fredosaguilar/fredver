# Backend: every push to main is type-checked. Deploys are done from a signed-in session (see README).
# infra/setup-github-deploy.sh can enable deploying from GitHub later, if wanted.
name: Backend
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit --module nodenext --moduleResolution nodenext --target es2022 --skipLibCheck src/server.ts src/sync-job.ts src/import-hiver.ts

